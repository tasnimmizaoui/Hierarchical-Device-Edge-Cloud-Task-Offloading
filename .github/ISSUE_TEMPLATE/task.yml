name: Project task
about: Track an implementation, research, experiment, or writing task
labels: []
body:
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - Student 1 — Simulation & Evaluation
        - Student 2 — RL & Coordination
        - Shared
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Simulation
        - Workload / dataset
        - Network / energy / queues
        - Baseline
        - RL environment / agent
        - Coordination
        - Experiment / analysis
        - Report / presentation
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should be achieved?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks proving this task is complete.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
    validations:
      required: false
